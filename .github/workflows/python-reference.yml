name: Python reference

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "fixtures/**"
      - "schemas/**"
      - "scripts/**"
      - "skills/**"
      - ".claude-plugin/**"
      - "pyproject.toml"
      - ".github/workflows/python-reference.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "fixtures/**"
      - "schemas/**"
      - "scripts/**"
      - "skills/**"
      - ".claude-plugin/**"
      - "pyproject.toml"
      - ".github/workflows/python-reference.yml"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.11"
          - os: macos-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
