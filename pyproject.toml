[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-kpt"
version = "0.1.0"
description = "Retrospectives for human-agent workflows"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent-kpt = "agent_kpt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
